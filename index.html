<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Simulation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      background: #f4eee1;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      touch-action: none;
    }
    #gearBtn {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(20, 22, 28, 0.35);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s;
    }
    #gearBtn.hidden { opacity: 0; pointer-events: none; }
    #stopPill {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: rgba(239, 68, 68, 0.25);
      color: rgba(239, 68, 68, 0.9);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      z-index: 20;
      display: none;
    }
    #drawer {
      position: fixed;
      top: 66px;
      right: 16px;
      width: 285px;
      max-height: calc(100vh - 84px);
      overflow-y: auto;
      background: rgba(20, 22, 30, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 16px;
      color: #f1f5f9;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 30;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
    #drawer.open { display: flex; }
    .row { display: flex; flex-direction: column; gap: 5px; }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #cbd5e1;
    }
    input[type="range"] { width: 100%; accent-color: #38bdf8; }
    select, button.action {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.14);
      background: #1e222d;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.record { background: #10b981; color: #042f1e; border: none; }
    button.setup-active { background: #38bdf8; color: #082f49; border: none; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      padding-top: 2px;
    }
    .color-swatch {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .color-swatch input[type="color"] {
      position: absolute;
      inset: -6px;
      width: calc(100% + 12px);
      height: calc(100% + 12px);
      border: none;
      cursor: pointer;
      background: none;
    }
    .hint {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.35;
    }
  </style>
</head>
<body>

  <canvas id="simCanvas" width="1080" height="1920"></canvas>

  <button id="gearBtn" aria-label="Settings">⚙️</button>
  <button id="stopPill">■ Stop Recording</button>

  <div id="drawer">
    <div class="row">
      <label>Colors / Balls <span id="vBalls">6</span></label>
      <input type="range" id="inBalls" min="2" max="10" value="6" />
    </div>

    <div class="row">
      <label>Ball Colors (Tap to Change)</label>
      <div class="color-grid" id="colorGrid"></div>
    </div>

    <div class="row">
      <button class="action" id="btnSetup">✋ Drag Start Positions: OFF</button>
      <div class="hint">Turn ON to pause & drag balls anywhere inside the circle before launching.</div>
    </div>

    <div class="row">
      <label>Speed <span id="vSpeed">1.1x</span></label>
      <input type="range" id="inSpeed" min="0.5" max="2.2" step="0.1" value="1.1" />
    </div>

    <div class="row">
      <label>Gravity <span id="vGrav">0.22</span></label>
      <input type="range" id="inGrav" min="0" max="0.8" step="0.02" value="0.22" />
    </div>

    <div class="row">
      <select id="inMode">
        <option value="elim">Elimination (Last Color Wins)</option>
        <option value="endless">Endless String Cutting</option>
      </select>
    </div>

    <div class="row">
      <select id="inTheme">
        <option value="cream">Cream Background</option>
        <option value="dark">Dark Background</option>
      </select>
    </div>

    <div class="row">
      <select id="inSound">
        <option value="marimba">Marimba + Snip SFX</option>
        <option value="harp">Harp + Snip SFX</option>
        <option value="mute">Muted</option>
      </select>
    </div>

    <div class="grid2">
      <button class="action" id="btnReset">Reset</button>
      <button class="action" id="btnAudio">Sound On</button>
    </div>
    <button class="action record" id="btnRec">● Record Video</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  const W = 1080;
  const H = 1920;
  const CX = W / 2;
  const CY = H / 2;
  const ARENA_R = 440;

  const DEFAULT_HEX = [
    '#d49b27',
    '#722b8c',
    '#1e7d58',
    '#23629e',
    '#9e212b',
    '#242429',
    '#c95318',
    '#0d85a6',
    '#b82578',
    '#4f8512'
  ];

  let customColors = [...DEFAULT_HEX];
  let customStartPos = [];
  let setupMode = false;
  let draggingBall = null;

  const gearBtn = document.getElementById('gearBtn');
  const drawer = document.getElementById('drawer');
  const stopPill = document.getElementById('stopPill');
  const inBalls = document.getElementById('inBalls');
  const inSpeed = document.getElementById('inSpeed');
  const inGrav = document.getElementById('inGrav');
  const inMode = document.getElementById('inMode');
  const inTheme = document.getElementById('inTheme');
  const inSound = document.getElementById('inSound');
  const colorGrid = document.getElementById('colorGrid');
  const btnSetup = document.getElementById('btnSetup');

  gearBtn.addEventListener('click', () => drawer.classList.toggle('open'));

  function shadeHex(hex, percent) {
    const num = parseInt(hex.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.min(255, Math.max(0, (num >> 16) + amt));
    const G = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
    const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
    return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
  }

  function buildColorPickers() {
    const count = parseInt(inBalls.value, 10);
    colorGrid.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'color-swatch';
      const input = document.createElement('input');
      input.type = 'color';
      input.value = customColors[i];
      input.addEventListener('input', (e) => {
        customColors[i] = e.target.value;
        if (balls[i]) balls[i].hex = e.target.value;
      });
      wrap.appendChild(input);
      colorGrid.appendChild(wrap);
    }
  }

  btnSetup.addEventListener('click', () => {
    setupMode = !setupMode;
    if (setupMode) {
      btnSetup.textContent = '🚀 Launch Simulation';
      btnSetup.classList.add('setup-active');
      balls.forEach((b, idx) => {
        b.anchors = [];
        b.hasSpawnedStrings = false;
        b.alive = true;
        if (customStartPos[idx]) {
          b.x = customStartPos[idx].x;
          b.y = customStartPos[idx].y;
        }
      });
      sparks = [];
      drawer.classList.remove('open');
    } else {
      btnSetup.textContent = '✋ Drag Start Positions: OFF';
      btnSetup.classList.remove('setup-active');
      balls.forEach((b) => {
        const dir = Math.random() * Math.PI * 2;
        const spd = 8.5 + Math.random() * 2.5;
        b.vx = Math.cos(dir) * spd;
        b.vy = Math.sin(dir) * spd;
      });
    }
  });

  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scale = Math.min(rect.width / W, rect.height / H);
    const renderedW = W * scale;
    const renderedH = H * scale;
    const offsetX = (rect.width - renderedW) / 2;
    const offsetY = (rect.height - renderedH) / 2;

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    return {
      x: (clientX - rect.left - offsetX) / scale,
      y: (clientY - rect.top - offsetY) / scale
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    drawer.classList.remove('open');
    initAudio();
    if (!setupMode) return;

    const pt = getCanvasCoords(e);
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (Math.hypot(pt.x - b.x, pt.y - b.y) <= b.r * 1.8) {
        draggingBall = b;
        break;
      }
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (!draggingBall || !setupMode) return;
    const pt = getCanvasCoords(e);
    const dx = pt.x - CX;
    const dy = pt.y - CY;
    const dist = Math.hypot(dx, dy);
    const maxR = ARENA_R - draggingBall.r - 4;

    if (dist > maxR) {
      draggingBall.x = CX + (dx / dist) * maxR;
      draggingBall.y = CY + (dy / dist) * maxR;
    } else {
      draggingBall.x = pt.x;
      draggingBall.y = pt.y;
    }
    customStartPos[draggingBall.id] = { x: draggingBall.x, y: draggingBall.y };
  });

  window.addEventListener('pointerup', () => {
    draggingBall = null;
  });

  let audioCtx = null;
  let audioDest = null;
  let noteStep = 0;
  const SCALE = [
    261.63, 293.66, 329.63, 392.00, 440.00,
    523.25, 587.33, 659.25, 783.99, 880.00,
    1046.50, 1174.66, 1318.51, 1567.98
  ];

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioDest = audioCtx.createMediaStreamDestination();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    document.getElementById('btnAudio').textContent = 'Sound ✓';
  }

  function playBounce(speed) {
    if (!audioCtx || inSound.value === 'mute') return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = inSound.value === 'harp' ? 'triangle' : 'sine';
    osc.frequency.setValueAtTime(SCALE[noteStep % SCALE.length], now);
    noteStep++;

    const vol = Math.min(0.24, Math.max(0.05, speed / 48));
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(vol, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (audioDest) gain.connect(audioDest);

    osc.start(now);
    osc.stop(now + 0.4);
  }

  function playCut() {
    if (!audioCtx || inSound.value === 'mute') return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(920, now);
    osc.frequency.exponentialRampToValueAtTime(220, now + 0.07);

    gain.gain.setValueAtTime(0.09, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (audioDest) gain.connect(audioDest);

    osc.start(now);
    osc.stop(now + 0.08);
  }

  let balls = [];
  let sparks = [];

  function spawnBalls(keepPositions) {
    const count = parseInt(inBalls.value, 10);
    balls = [];
    sparks = [];
    noteStep = 0;

    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count - Math.PI / 2;
      const dist = 160;
      const spd = 8 + Math.random() * 3;
      const dir = angle + (Math.random() * 1.1 - 0.55) + Math.PI / 2;

      const startX = (keepPositions && customStartPos[i])
        ? customStartPos[i].x
        : CX + Math.cos(angle) * dist;
      const startY = (keepPositions && customStartPos[i])
        ? customStartPos[i].y
        : CY + Math.sin(angle) * dist;

      balls.push({
        id: i,
        x: startX,
        y: startY,
        vx: Math.cos(dir) * spd,
        vy: Math.sin(dir) * spd,
        r: 26,
        hex: customColors[i],
        anchors: [],
        hasSpawnedStrings: false,
        alive: true
      });
    }
    buildColorPickers();
  }

  function pointToSegmentDist(px, py, x1, y1, x2, y2) {
    const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
    if (l2 === 0) return { dist: Math.hypot(px - x1, py - y1), cx: x1, cy: y1 };
    let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * (x2 - x1);
    const cy = y1 + t * (y2 - y1);
    return { dist: Math.hypot(px - cx, py - cy), cx, cy };
  }

  function addCutSparks(x, y, color) {
    for (let k = 0; k < 5; k++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 5;
      sparks.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 1.0,
        color
      });
    }
  }

  function stepPhysics() {
    if (setupMode) return;

    const spdMult = parseFloat(inSpeed.value);
    const grav = parseFloat(inGrav.value);
    const elimMode = inMode.value === 'elim';
    const subSteps = 3;

    for (let s = 0; s < subSteps; s++) {
      for (const b of balls) {
        if (!b.alive) continue;

        b.vy += (grav * spdMult) / subSteps;
        b.x += (b.vx * spdMult) / subSteps;
        b.y += (b.vy * spdMult) / subSteps;

        const dx = b.x - CX;
        const dy = b.y - CY;
        const dist = Math.hypot(dx, dy);

        if (dist + b.r >= ARENA_R) {
          const nx = dx / dist;
          const ny = dy / dist;

          b.x = CX + nx * (ARENA_R - b.r);
          b.y = CY + ny * (ARENA_R - b.r);

          b.anchors.push({ x: CX + nx * ARENA_R, y: CY + ny * ARENA_R });
          b.hasSpawnedStrings = true;
          if (b.anchors.length > 90) b.anchors.shift();

          const dot = b.vx * nx + b.vy * ny;
          b.vx = (b.vx - 2 * dot * nx) * 0.997;
          b.vy = (b.vy - 2 * dot * ny) * 0.997;

          const curSpd = Math.hypot(b.vx, b.vy);
          if (curSpd < 6.5) {
            b.vx = (b.vx / curSpd) * 7.2;
            b.vy = (b.vy / curSpd) * 7.2;
          }

          playBounce(curSpd * spdMult);
        }
      }

      for (const cutter of balls) {
        if (!cutter.alive) continue;

        for (const owner of balls) {
          if (!owner.alive || owner.id === cutter.id) continue;
          if (owner.anchors.length === 0) continue;

          let anyCut = false;
          owner.anchors = owner.anchors.filter((anchor) => {
            const hit = pointToSegmentDist(
              cutter.x, cutter.y,
              anchor.x, anchor.y,
              owner.x, owner.y
            );
            if (hit.dist <= cutter.r * 0.92) {
              addCutSparks(hit.cx, hit.cy, owner.hex);
              anyCut = true;
              return false;
            }
            return true;
          });

          if (anyCut) {
            playCut();
            if (elimMode && owner.hasSpawnedStrings && owner.anchors.length === 0) {
              const aliveCount = balls.filter(x => x.alive).length;
              if (aliveCount > 1) {
                owner.alive = false;
                for (let p = 0; p < 18; p++) {
                  addCutSparks(owner.x, owner.y, owner.hex);
                }
              }
            }
          }
        }
      }

      for (let i = 0; i < balls.length; i++) {
        if (!balls[i].alive) continue;
        for (let j = i + 1; j < balls.length; j++) {
          if (!balls[j].alive) continue;
          const b1 = balls[i];
          const b2 = balls[j];
          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = b1.r + b2.r;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = (minDist - dist) / 2;

            b1.x -= nx * overlap;
            b1.y -= ny * overlap;
            b2.x += nx * overlap;
            b2.y += ny * overlap;

            const dvx = b2.vx - b1.vx;
            const dvy = b2.vy - b1.vy;
            const velAlongNormal = dvx * nx + dvy * ny;

            if (velAlongNormal < 0) {
              const imp = -velAlongNormal;
              b1.vx -= imp * nx;
              b1.vy -= imp * ny;
              b2.vx += imp * nx;
              b2.vy += imp * ny;
            }
          }
        }
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i];
      sp.x += sp.vx;
      sp.y += sp.vy;
      sp.life -= 0.06;
      if (sp.life <= 0) sparks.splice(i, 1);
    }
  }

  function render() {
    const isDark = inTheme.value === 'dark';
    document.body.style.background = isDark ? '#0e1015' : '#f4eee1';

    ctx.fillStyle = isDark ? '#0e1015' : '#f4eee1';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.beginPath();
    ctx.arc(CX, CY, ARENA_R, 0, Math.PI * 2);
    ctx.fillStyle = isDark ? '#151821' : '#faf6ee';
    ctx.fill();
    ctx.clip();

    for (const b of balls) {
      if (!b.alive) continue;
      ctx.strokeStyle = b.hex;
      ctx.lineWidth = 2.8;
      ctx.globalAlpha = 0.88;
      for (const a of b.anchors) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    for (const sp of sparks) {
      ctx.globalAlpha = Math.max(0, sp.life);
      ctx.fillStyle = sp.color;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const b of balls) {
      if (!b.alive) continue;
      ctx.beginPath();
      ctx.arc(b.x + 4, b.y + 6, b.r, 0, Math.PI * 2);
      ctx.fillStyle = isDark ? 'rgba(0,0,0,0.45)' : 'rgba(0,0,0,0.16)';
      ctx.fill();

      const grad = ctx.createRadialGradient(
        b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.1,
        b.x, b.y, b.r
      );
      grad.addColorStop(0, shadeHex(b.hex, 45));
      grad.addColorStop(0.55, b.hex);
      grad.addColorStop(1, shadeHex(b.hex, -45));

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      if (setupMode) {
        ctx.save();
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.65)' : 'rgba(0,0,0,0.45)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }
    ctx.restore();

    ctx.beginPath();
    ctx.arc(CX, CY, ARENA_R, 0, Math.PI * 2);
    ctx.lineWidth = 7;
    ctx.strokeStyle = isDark ? '#c59227' : '#b89446';
    ctx.stroke();
  }

  function loop() {
    stepPhysics();
    render();
    requestAnimationFrame(loop);
  }

  let recorder = null;
  let chunks = [];

  function startRecording() {
    if (setupMode) {
      setupMode = false;
      btnSetup.textContent = '✋ Drag Start Positions: OFF';
      btnSetup.classList.remove('setup-active');
    }
    initAudio();
    drawer.classList.remove('open');
    gearBtn.classList.add('hidden');
    stopPill.style.display = 'block';

    const
